/* -*-c++-*- */

%module stringType;

// by ending the inner type with "&" you indicate that the type
// is to be passed by reference - otherwise the type will be passed
// by value
typedef string StringType <std::string&>
{
    convert_in(str)
    {
        return "[" + str + "]";
    }
    convert_out(str)
    {
        if (spi_util::StringStartsWith(str, "[") &&
            spi_util::StringEndsWith(str, "]"))
        {
            return str.substr(1, str.length() - 2);
        }
        else
        {
            SPI_THROW_RUNTIME_ERROR(str << " should be enclosed in [..]");
        }
    }
};


/**
 * Returns the inner value that you would see in code when you
 * pass in a string for a StringType
 */
extern string StringTypeInnerValue(StringType stype) noLog=True
{
    // what is happening here?
    //
    // we are in the inner value and we have received StringType
    // convert_in will enclose it in [...] and that is the string
    // that we return from this function - the output string is
    // not converted
    return stype;
}

/**
 * Returns the outer value that you see at the public API when
 * you pass in the inner value of a StringType (as string).
 *
 * This will require the innerValue to be enclosed in [...]
 */
extern StringType StringTypeOuterValue(string innerValue) noLog = True
{
    // what is happening here?
    //
    // innerValue has not been converted before we get here - it is
    // just a regular string
    //
    // we return it and expect it to be converted to StringType
    // this will strip out the [...] and return that part of the string
    return innerValue;
}


class ClassWithStringType
{
    public StringType str;
};
